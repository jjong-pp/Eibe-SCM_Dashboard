[project]
name = "eibe-platform"
version = "4.0.0"
description = "EIBE 통합 플랫폼 — SCM + Sales Hub"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]
ignore = [
    "ANN401",  # Any 허용 (JWT 페이로드 등)
    "B008",    # FastAPI 의 Depends() 기본값 패턴
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN", "E402"]
"alembic/*" = ["ANN", "E402", "F401"]
