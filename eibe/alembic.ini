# Alembic configuration.
#
# NOTE: Keep this file ASCII-only. Alembic reads it with the *locale* encoding
# (cp949 on Korean Windows), so non-ASCII comments break `alembic` commands.
# Korean documentation belongs in alembic/env.py, which is read as UTF-8.
#
# The database URL is deliberately absent here: alembic/env.py pulls it from
# app.config.settings so that .env stays the single source of connection info.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Date prefix keeps migrations sorted chronologically in the file listing.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
